services:
  app:
    build:
      context: .
    image: openclaw-hal-assistant:latest
    env_file:
      - .env
    environment:
      OPENCLAW_WAKE_WORD_MODEL_PATH: ${OPENCLAW_WAKE_WORD_MODEL_PATH:-/wake/porcupine_params.pv}
      OPENCLAW_WAKE_WORD_KEYWORD_PATH: ${OPENCLAW_WAKE_WORD_KEYWORD_PATH:-}
    ports:
      - "3000:3000"
    volumes:
      - ./wake-assets:/app/public/wake:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
