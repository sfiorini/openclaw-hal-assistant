name: Docker Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver tag to release (for example v1.2.3)"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: openclaw-hal-assistant

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit and integration tests
        env:
          ELEVENLABS_API_KEY: ci-key
          ELEVENLABS_VOICE_ID: ci-voice-id
          OPENCLAW_GATEWAY_URL: http://localhost:3000
          OPENCLAW_GATEWAY_TOKEN: ci-token
          OPENCLAW_RATE_LIMIT: 100
          OPENCLAW_AGENT_ID: main
          OPENCLAW_CHAT_REQUEST_TIMEOUT_MS: 120000
        run: pnpm test -- --run tests/unit tests/integration

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build production bundle
        env:
          ELEVENLABS_API_KEY: ci-key
          ELEVENLABS_VOICE_ID: ci-voice-id
          OPENCLAW_GATEWAY_URL: http://localhost:3000
          OPENCLAW_GATEWAY_TOKEN: ci-token
          OPENCLAW_RATE_LIMIT: 100
          OPENCLAW_AGENT_ID: main
          OPENCLAW_CHAT_REQUEST_TIMEOUT_MS: 120000
        run: pnpm build

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must match semver format (vX.Y.Z). Received $TAG"
            exit 1
          fi

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
